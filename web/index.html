<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!--
  Redirect stub. The real application is Webapp.html.

  WHY BOTH FILES EXIST
  index.html is the default document every static host serves at the root URL
  (Wix, Netlify, S3, IIS, an internal file share). Webapp.html is named so a
  non-technical reviewer opening the folder knows which file to double-click.
  Keeping this stub means the hosted root URL still loads the app instead of
  showing a directory listing or a 404.

  No JavaScript: the meta refresh below does the work, and the link is the
  fallback if a browser or policy ignores it. Paths are relative, so this
  works from file:// and from any subdirectory on a server.
-->
<meta http-equiv="refresh" content="0; url=Webapp.html" />
<link rel="canonical" href="Webapp.html" />
<title>Travel Calculator Suite</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6fb;
    color: #1f2937;
    text-align: center;
    padding: 24px;
  }
  .box {
    max-width: 30rem;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 0.75rem;
  }
  p {
    margin: 0 0 1.25rem;
    line-height: 1.5;
  }
  a.go {
    display: inline-block;
    padding: 0.7rem 1.4rem;
    background: #1d4ed8;
    color: #fff;
    text-decoration: none;
    border-radius: 7px;
    font-weight: 600;
  }
  a.go:hover,
  a.go:focus {
    background: #1740b5;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #e5e7eb; }
    a.go { background: #3b63e0; }
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Travel Calculator Suite</h1>
    <p>Opening the calculator&hellip; if nothing happens, use the button below.</p>
    <p><a class="go" href="Webapp.html">Open Travel Calculator Suite</a></p>
  </div>
</body>
</html>
